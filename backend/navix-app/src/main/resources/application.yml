server:
  port: 8080

spring:
  application:
    name: navix-finance
  mvc:
    # Raise NoHandlerFoundException for an unmapped path so GlobalExceptionHandler can answer 404
    # instead of letting it fall through and surface as a 500. The static-resource handler stays
    # mapped (Swagger UI serves its assets through it); its NoResourceFoundException is handled too.
    throw-exception-if-no-handler-found: true
  # Load config + secrets from AWS SSM Parameter Store. `optional:` lets the app
  # still start without AWS (local fallback to env vars / defaults below).
  # Parameters under /navix/<env>/ map to properties, e.g.
  #   /navix/dev/spring/datasource/password  ->  spring.datasource.password
  config:
    import: optional:aws-parameterstore:/navix/${NAVIX_ENV:dev}/
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-south-1}
      # Credentials come from the DEFAULT provider chain: ECS task role in prod,
      # your AWS_PROFILE / env vars locally. Never hardcode access keys.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/navix}
    username: ${DB_USERNAME:navix}
    password: ${DB_PASSWORD:navix}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates against it.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Logging — the appender/pattern live in logback-spring.xml (CloudWatch-friendly, MDC-aware).
# Only the com.navix level is set here so ops can raise it to DEBUG in ECS via NAVIX_LOG_LEVEL
# (env var) without a redeploy of the logback config. Framework loggers are tamed in the xml.
logging:
  level:
    com.navix: ${NAVIX_LOG_LEVEL:INFO}

# DhanBoost integration settings
navix:
  # Opt-in demo fixture: when set, every Experian bureau pull returns this bundled report instead of
  # calling Fintrix (the live sandbox is thin-file). Use classpath:samplepan.json or an absolute path
  # to see a rich credit brief + rating locally. Leave blank in real environments.
  bureau:
    fixture: ${NAVIX_BUREAU_FIXTURE:}
  # Verification providers. Signzy is PRIMARY, Digitap is the FALLBACK (see RoutingVerificationPort +
  # docs/signzy, docs/digitap). Base URLs default to the PREPRODUCTION/UAT hosts and are env-overridable;
  # switch to the prod hosts (api.signzy.app / svc.digitap.ai / api.digitap.ai) via the *_BASE_URL vars.
  # API keys come from the environment / backend/.env (auto-loaded by spring-dotenv) — never committed.
  signzy:
    # Signzy sends the RAW opaque token in Authorization (not Basic/Bearer) + the account's
    # unique id in the x-client-unique-id header.
    base-url: ${SIGNZY_BASE_URL:https://api-preproduction.signzy.app}
    token: ${SIGNZY_TOKEN:}
    client-unique-id: ${SIGNZY_CLIENT_UNIQUE_ID:}
    # Signzy PRODUCTION account — serves PAN 206AB (unmasked name) + reverse-geocode (address).
    prod-base-url: ${SIGNZY_PROD_BASE_URL:https://api.signzy.app}
    prod-token: ${SIGNZY_PROD_TOKEN:}
  digitap:
    # Two hosts: svc (KYC/Employment/Email), api (Credit/Location/Face-Match/OCR). Auth = Basic base64(id:secret).
    svc-base-url: ${DIGITAP_SVC_BASE_URL:https://svcdemo.digitap.work}
    api-base-url: ${DIGITAP_API_BASE_URL:https://apidemo.digitap.work}
    client-id: ${DIGITAP_CLIENT_ID:}
    client-secret: ${DIGITAP_CLIENT_SECRET:}
  verification:
    # Ordered provider chain the router tries per capability (skips unsupported, falls back on failure).
    chain: ${NAVIX_VERIFICATION_CHAIN:signzy,digitap}
  storage:
    # S3 bucket for documents/images (KYC, loan docs, payment & collections proofs).
    bucket: ${NAVIX_S3_BUCKET:navix-finance-documents-dev}
    # Presigned-URL validity in seconds (default 15 min).
    presign-ttl-seconds: ${NAVIX_S3_PRESIGN_TTL:900}
    # Optional KMS key (ARN/alias) for server-side puts; bucket default encryption
    # otherwise applies. Leave blank to use the bucket default.
    kms-key-id: ${NAVIX_S3_KMS_KEY_ID:}

  # Auth tokens (HS256 JWT). secret is SHA-256'd into the HMAC key. Borrowers get a longer TTL
  # (7-day "remember me"); staff keep the shorter one. Set a strong AUTH_SECRET in real environments.
  auth:
    secret: ${AUTH_SECRET:navix-local-dev-secret-change-me}
    ttl-seconds: ${AUTH_TTL_SECONDS:86400}
    borrower-ttl-seconds: ${BORROWER_AUTH_TTL_SECONDS:604800}

  # App-level URLs. frontend-base-url builds the password-reset links carried in emails.
  app:
    frontend-base-url: ${NAVIX_APP_BASE_URL:http://localhost:3000}

  # Daily payment-reminder sweep (PaymentReminderScheduler). Spring cron: sec min hour dom mon dow.
  reminders:
    cron: ${NAVIX_REMINDERS_CRON:0 0 9 * * *}

  # Refer-a-friend program. enabled gates the whole feature; reward-paise is the per-person reward
  # (₹200 = 20000 paise). Read at boot — override per env via the SSM params
  # /navix/<env>/navix/referral/{enabled,reward-paise} (a change needs a restart/redeploy).
  referral:
    enabled: ${NAVIX_REFERRAL_ENABLED:true}
    reward-paise: ${NAVIX_REFERRAL_REWARD_PAISE:20000}

  # Borrower OTP delivery via the UltronSMS gateway. The doc demo creds are placeholders
  # ("username or password is invalid") — set real NAVIX_SMS_USER/PASSWORD or NAVIX_SMS_API_KEY.
  sms:
    base-url: ${NAVIX_SMS_BASE_URL:https://ultronsms.com/api/mt/}
    user: ${NAVIX_SMS_USER:demo}
    password: ${NAVIX_SMS_PASSWORD:demo123}
    api-key: ${NAVIX_SMS_API_KEY:}
    sender-id: ${NAVIX_SMS_SENDER_ID:DHANBT}
    # Promo | Trans. OTP is transactional; the route/peid/dlt-template-id are India-DLT params.
    channel: ${NAVIX_SMS_CHANNEL:Trans}
    route: ${NAVIX_SMS_ROUTE:02}
    # PE-ID is entity-level and constant across every template (NAVIX FINANCE PRIVATE LIMITED).
    peid: ${NAVIX_SMS_PEID:1701178039634361131}
    # Fallback / OTP DLT Template ID (used when no per-type id below is set for a notification).
    dlt-template-id: ${NAVIX_SMS_DLT_TEMPLATE_ID:1777178551180955540}
    # Per-NotificationType DLT Template IDs (keyed by the enum name). The DHANBOOST_*_V1 batch is
    # Active on DLT and Approved in the UltronSMS panel (2026-08-02) — ids defaulted here, no env
    # plumbing needed; override an individual one only if a template is re-registered.
    # NOTE: CREDIT_REJECTED and REBORROW_REVIEW_REJECTED share the one APPLICATION_DECLINED id.
    # NOTE: REBORROW_PREAPPROVED + REFERRAL_REWARD_CREDITED are registered PROMOTIONAL — they need a
    # promotional route, so they fail on the transactional route above until that is split out.
    dlt-template-ids:
      KYC_APPROVED: ${NAVIX_SMS_DLT_KYC_APPROVED:1777178556860826081}
      KYC_REJECTED: ${NAVIX_SMS_DLT_KYC_REJECTED:1777178556856596751}
      KYC_REMINDER: ${NAVIX_SMS_DLT_KYC_REMINDER:1777178556869196458}
      LOAN_DISBURSED: ${NAVIX_SMS_DLT_LOAN_DISBURSED:1777178556842056405}
      REPAYMENT_VERIFIED: ${NAVIX_SMS_DLT_REPAYMENT_VERIFIED:1777178551212221383}
      REPAYMENT_REJECTED: ${NAVIX_SMS_DLT_REPAYMENT_REJECTED:1777178551218012610}
      PAYMENT_DUE_SOON: ${NAVIX_SMS_DLT_PAYMENT_DUE_SOON:1777178556822213797}
      PAYMENT_OVERDUE: ${NAVIX_SMS_DLT_PAYMENT_OVERDUE:1777178556852586580}
      LOAN_CLOSED: ${NAVIX_SMS_DLT_LOAN_CLOSED:1777178551234723180}
      CREDIT_REJECTED: ${NAVIX_SMS_DLT_APPLICATION_DECLINED:1777178556864993650}
      REBORROW_REVIEW_REJECTED: ${NAVIX_SMS_DLT_APPLICATION_DECLINED:1777178556864993650}
      SETTLEMENT_APPROVED: ${NAVIX_SMS_DLT_SETTLEMENT_APPROVED:1777178556848308137}
      REBORROW_REVIEW_APPROVED: ${NAVIX_SMS_DLT_REBORROW_APPROVED:1777178556873259005}
      REBORROW_PREAPPROVED: ${NAVIX_SMS_DLT_REBORROW_PREAPPROVED:1777178551273887503}
      REFERRAL_REWARD_CREDITED: ${NAVIX_SMS_DLT_REFERRAL_REWARD_CREDITED:1777178551284965972}
    # DLT-registered OTP message ({otp} = code, {ttl} = minutes). MUST match a template
    # registered for the sender or the gateway returns "Invalid template text".
    otp-template: ${NAVIX_SMS_OTP_TEMPLATE:Your OTP for DhanBoost login is {otp}. It is valid for {ttl} minutes. Do not share this OTP with anyone. - DhanBoost}
    enabled: ${NAVIX_SMS_ENABLED:true}
    # DEV ONLY — returns the OTP in the request response when SMS can't reach a handset. MUST be false in prod.
    dev-echo: ${NAVIX_SMS_DEV_ECHO:false}
    otp-ttl-seconds: ${NAVIX_SMS_OTP_TTL:300}
    otp-length: ${NAVIX_SMS_OTP_LENGTH:6}
    # DEMO/TESTING — when true, a fixed mock-code always verifies and NO SMS is sent (no DLT needed).
    # MUST be false in production. Set NAVIX_SMS_MOCK=true to use OTP 123456 for testing.
    mock: ${NAVIX_SMS_MOCK:false}
    mock-code: ${NAVIX_SMS_MOCK_CODE:123456}

  # Notification engine (in-app + SMS + email). Delivery is mock/log by default (mirrors the SMS-mock
  # philosophy): in-app is fully persisted, SMS reuses the gateway (mock-aware), and email logs via
  # LogEmailClient. Flip email to real SMTP with NAVIX_EMAIL_PROVIDER=smtp + spring.mail.* configured.
  email:
    provider: ${NAVIX_EMAIL_PROVIDER:log}      # log | smtp | ses | resend
    enabled: ${NAVIX_EMAIL_ENABLED:true}
    from: ${NAVIX_EMAIL_FROM:DhanBoost <no-reply@dhanboost.example>}
    # SES only: tag sends with a SES configuration set so bounce/complaint events fire to SNS->SQS.
    configuration-set: ${NAVIX_SES_CONFIG_SET:}
    # Resend only: API key for the Resend HTTP provider (interim while SES is sandbox-blocked).
    resend-api-key: ${RESEND_API_KEY:}
  # Marketing "Contact us" form — where website enquiries are emailed (via the shared EmailClient).
  contact:
    recipient: ${NAVIX_CONTACT_RECIPIENT:navixfinance@gmail.com}
  # Grievance Redressal Officer — named on the Key Fact Statement the borrower eSigns, and mirrored
  # by BRAND.grievanceOfficer in the frontend. Regulatory copy: change both together.
  grievance:
    officer-name: ${NAVIX_GRIEVANCE_NAME:Lalit Kumar}
    officer-phone: ${NAVIX_GRIEVANCE_PHONE:9716760246}
    officer-email: ${NAVIX_GRIEVANCE_EMAIL:grievance@dhanboost.com}
  # SES bounce/complaint ingestion (SES config-set -> SNS -> SQS -> SesEventSqsListener). Off by
  # default so the app boots without an SQS queue; flip on in AWS environments.
  ses:
    events:
      enabled: ${NAVIX_SES_EVENTS_ENABLED:false}
      queue: ${NAVIX_SES_EVENTS_QUEUE:navix-ses-events}
  notifications:
    async:
      core-pool-size: ${NAVIX_NOTIF_CORE_POOL:2}
      max-pool-size: ${NAVIX_NOTIF_MAX_POOL:8}
      queue-capacity: ${NAVIX_NOTIF_QUEUE:500}

# API documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
