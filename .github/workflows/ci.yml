name: CI

# Offline lanes only — no secrets/network required, so this runs on every push/PR.
# Live lanes (Fintrix sandbox smoke `-Psandbox`, S3 round-trip, Playwright E2E against a
# running stack) need creds + the app up; run those manually / in a gated workflow.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: "Existing ECR image tag to deploy (manual rollback; leave empty for no deployment)"
        required: false
        type: string

jobs:
  backend:
    name: Backend — unit + Testcontainers IT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build sibling jars
        working-directory: backend
        run: ./mvnw -B -q install -DskipTests
      - name: Unit tests (offline)
        working-directory: backend
        run: ./mvnw -B test
      # Testcontainers needs Docker (present on ubuntu-latest). Integration tests are
      # @Tag("integration") and excluded from the default run; the -Pit profile enables them.
      - name: Integration tests (Testcontainers Postgres)
        working-directory: backend
        run: ./mvnw -B -pl navix-app -Pit test

  frontend:
    name: Frontend — typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        # `npm install` (not `npm ci`) — the lockfile is generated on macOS and some
        # platform-specific optional deps (@emnapi/* via sharp) aren't captured for Linux,
        # which makes `npm ci`'s strict in-sync check fail on the runner.
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npx eslint .
      # NOTE: `npm run build` is intentionally NOT run — Next 15.1.3 static-prerender fails
      # at /staff/admin/staff (known environmental bug). tsc + eslint are the gates.

  # ---------------------------------------------------------------------------
  # Production frontend deploy. Lives in THIS workflow rather than its own so it can
  # `needs:` the test jobs — a separate workflow can only react to CI via workflow_run,
  # which fires even when CI failed and then has to re-check the conclusion by hand.
  #
  # Why an Action at all, when Vercel has a native Git integration: (1) the native one
  # deploys regardless of whether tests passed; (2) a DIFFERENT Vercel project ("frontend"
  # under devshubham07s-projects) is already Git-connected to this repo and owns no domain,
  # so it builds every push and updates nothing — connecting a second project natively would
  # just add a second decoy. This job targets the one project that actually serves
  # dhanboost.com, by id.
  #
  # The build runs on Vercel (not here) via --archive=tgz: `npm run build` on a runner hits
  # the Next static-prerender bug noted above, and Vercel's build already works.
  deploy-frontend:
    name: Deploy frontend → Vercel (production)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Never let two deploys race for the same alias; cancel-in-progress is deliberately
    # false so an in-flight deploy finishes rather than leaving the alias half-moved.
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      # Not secrets — plain identifiers, visible in every Vercel dashboard URL. Keeping them
      # here means the only thing to configure is VERCEL_TOKEN. The CLI reads these instead of
      # .vercel/project.json, which is gitignored and therefore absent on the runner.
      VERCEL_ORG_ID: team_fD7U271h9m7wnsgnUs5SuKOG
      VERCEL_PROJECT_ID: prj_ukQ9y9Qv4shSLIs0DQ4ahL5SP7WF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check VERCEL_TOKEN is configured
        # Without this the CLI fails with an opaque auth error several minutes in.
        # The secret goes through env rather than ${{ }} interpolation: inlining it would
        # bake the value into the generated shell script on disk.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set — add it under Settings → Secrets → Actions."
            exit 1
          fi
      - name: Deploy to production
        working-directory: frontend
        run: npx vercel@latest deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify the live site picked up this build
        # The alias moving is the only thing that matters; a green deploy that leaves
        # dhanboost.com on the old build is exactly the failure this repo already hit.
        run: |
          sleep 10
          hdr=$(curl -sI https://dhanboost.com/login | tr -d '\r' | grep -i '^permissions-policy' || true)
          echo "$hdr"
          case "$hdr" in
            *"geolocation=(self)"*) echo "✓ live site is serving the current build" ;;
            *) echo "::warning::dhanboost.com did not show the expected header — check the alias." ;;
          esac

  # ---------------------------------------------------------------------------
  # Production backend deploy. Main pushes build an immutable image; manual
  # dispatch can deploy an existing tag for rollback without rebuilding.
  deploy-backend:
    name: Deploy backend -> ECS (production)
    needs: [backend]
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_tag != '')
    runs-on: ubuntu-latest
    # Must match the configured environment's exact case ("Production") — GitHub Actions'
    # environment: job key is case-sensitive at runtime even though the REST API for managing
    # environments/secrets is case-insensitive, so a lowercase mismatch here silently resolves to
    # no environment at all (secrets configured under "Production" never get injected).
    environment: Production
    concurrency:
      group: ecs-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      ECR_REGISTRY: 382188661325.dkr.ecr.ap-south-1.amazonaws.com
      ECR_REPOSITORY: navix-finance
      ECS_CLUSTER: navix-cluster
      ECS_SERVICE: navix-backend
      ECS_TASK_FAMILY: navix-finance
      BACKEND_HEALTH_URL: http://navix-alb-148184383.ap-south-1.elb.amazonaws.com/actuator/health
    steps:
      - uses: actions/checkout@v4
      - name: Check AWS deploy role is configured
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "::error::AWS_ROLE_TO_ASSUME is not configured in the production environment."
            exit 1
          fi
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Select image tag
        id: image
        env:
          MANUAL_TAG: ${{ inputs.deploy_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          tag="$COMMIT_SHA"
          if [ -n "$MANUAL_TAG" ]; then
            if [[ ! "$MANUAL_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]; then
              echo "::error::deploy_tag contains invalid characters."
              exit 1
            fi
            tag="$MANUAL_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$tag" >> "$GITHUB_OUTPUT"
      - name: Build and push backend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
      - name: Render task definition with selected image
        env:
          IMAGE_URI: ${{ steps.image.outputs.image }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.source.json
          jq --arg image "$IMAGE_URI" '
            if (.containerDefinitions | length) != 1 then
              error("expected exactly one ECS container definition")
            else
              .containerDefinitions[0].image = $image |
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
            end
          ' task-definition.source.json > task-definition.deploy.json
      - name: Register task definition and update ECS service
        id: deploy
        run: |
          task_definition=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.deploy.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          echo "task_definition=$task_definition" >> "$GITHUB_OUTPUT"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$task_definition" \
            --force-new-deployment \
            --output json > ecs-update.json
      - name: Wait for ECS service stability
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
      - name: Verify backend health through the ALB
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 \
            --retry-connrefused "$BACKEND_HEALTH_URL"
          echo
          echo "Backend deployment is healthy: ${{ steps.deploy.outputs.task_definition }}"

  # ---------------------------------------------------------------------------
  # Live E2E lane (manual): bring up Postgres + the backend (NAVIX_SMS_DEV_ECHO=true) +
  # `npm run dev`, then `npx playwright test`. Needs AWS creds (S3) + the Fintrix sandbox,
  # so it is dispatch-only rather than on every push.
  # e2e:
  #   if: github.event_name == 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   ...
